<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKS GitOps Microservices Demo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 50px; }
        .card { background: #1e293b; border-radius: 12px; padding: 30px; display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .status { font-weight: bold; color: #38bdf8; }
        .pod { color: #facc15; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="card">
        <h1>AWS EKS GitOps Microservices</h1>
        <p>Frontend: <span style="color:#4ade80;">Running</span></p>
        <hr style="border-color:#334155;">
        <h3>Backend API Status:</h3>
        <p id="backend-status" class="status">Connecting to Backend...</p>
        <p id="pod-info" class="pod"></p>
    </div>

    <script>
        fetch('/api/data')
            .then(res => res.json())
            .then(data => {
                document.getElementById('backend-status').innerText = data.message;
                document.getElementById('pod-info').innerText = 'Served by Pod: ' + data.podName;
            })
            .catch(err => {
                document.getElementById('backend-status').innerText = 'Backend Unavailable';
                document.getElementById('backend-status').style.color = '#ef4444';
            });
    </script>
</body>
</html>
